<!DOCTYPE html>
<html lang="ru">
<head>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border-radius: 0 !important; /* brutalist no radius */
    }

    html, body {
      height: 100%;

    body {

      font-family: 'Courier New', Courier, monospace;

      line-height: 1.2;
      display: flex;

      -webkit-font-smoothing: antialiased;
      padding-bottom: 64px; /* exact height of bottom nav */

    /* ----- TYPOGRAPHY ----- */
    h1, h2, h3, h4, .anton {
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    /* ----- LAYOUT & UTILS ----- */
    .container {
      flex: 1;
      padding: 16px 12px 24px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      min-height: 0; /* critical for flex children to shrink */
      padding-top: 56px; /* space for admin button */
    }

    .hidden {
      display: none !important;
    }

    /* ----- FADE-IN ANIMATION ----- */

      from { opacity: 0; }
      to   { opacity: 1; }

      animation: fadeIn 0.2s ease-in-out;

      top: 12px;

      z-index: 1000;
      background: #000;
      color: #fff;

      padding: 8px 16px;

      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 3px 3px 0 #000;

    }

    #adminBtn:hover {

    }

    /* ----- SCREEN HEADER ----- */
    .screen-header {
      font-family: 'Anton', sans-serif;

      line-height: 1;

      text-transform: uppercase;
      border-bottom: 4px solid #000;

    /* ----- PRODUCT GRID (2 columns) ----- */
    .product-grid {
      display: grid;

      gap: 16px 12px;

    .product-card {
      display: flex;
      flex-direction: column;

    .product-image-wrapper {
      position: relative;

      background: #eee;

      border-bottom: 2px solid #000;
    }

    .product-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: none;
    }

    .sold-out-img {
      filter: grayscale(100%) contrast(1.2);
    }

    .sold-out-badge {
      position: absolute;
      top: 50%;
      left: 50%;

      color: #fff;

    .product-info {

    }

    .product-name {

      text-transform: uppercase;
    }

    .product-price {
      font-family: 'Courier New', monospace;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    /* ----- ARCHIVE GRID (square photos) ----- */
    .archive-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    .archive-item {
      aspect-ratio: 1 / 1;
      border: 2px solid #000;
      background: #eee;
      cursor: pointer;
      overflow: hidden;
    }

    .archive-item img {
      width: 100%;
      height: 100%;

      display: block;

    /* fullscreen image overlay */

    /* ----- PRODUCT DETAIL (screen 3) ----- */

    /* ----- HELP SCREEN ----- */

    /* ----- BOTTOM NAV (fixed) ----- */

</head>
<body>

  <!-- ADMIN BUTTON (shown conditionally) -->
  <button id="adminBtn" class="hidden" onclick="showScreen('admin')">[ ADMIN ]</button>

  <!-- MAIN CONTAINER (screens) -->

    <!-- SCREEN 1: CATALOG -->
    <div id="screen-catalog" class="screen">

      <h1 class="screen-header">HELP</h1>

        <p><strong>CHANNEL:</strong> <a href="https://t.me/UndefinedArch" target="_blank">t.me/UndefinedArch</a></p>

    <!-- SCREEN 6: ADMIN (list + form) -->
    <div id="screen-admin" class="screen hidden">
      <h1 class="screen-header" style="margin-top:12px;">ADMIN · PRODUCTS</h1>
      <div id="adminList"></div>
      <button class="admin-add-btn" onclick="showAdminForm('create')">+ ДОБАВИТЬ НОВЫЙ ТОВАР</button>

      <!-- admin form (hidden by default) -->
      <div id="adminFormContainer" class="hidden">
        <h2 class="admin-section-title" id="adminFormTitle">НОВЫЙ ТОВАР</h2>
        <div class="admin-form">
          <label>Название</label>
          <input type="text" id="adminName" placeholder="ITEM NAME">

          <label>Цена</label>

          <label>Описание</label>

          <label>URL изображения</label>

          <div class="checkbox-row">
            <input type="checkbox" id="adminSoldOut">
            <span>SOLD OUT</span>
          </div>

  <!-- BOTTOM NAVIGATION -->

  </nav>

  <!-- FULLSCREEN OVERLAY (for archive) -->
  <div id="fullscreenOverlay" class="fullscreen-overlay hidden">
    <img id="fullscreenImage" src="" alt="archive full">
    <div class="fullscreen-close" onclick="closeFullscreen()">×</div>
  </div>

  <!-- ORDER MODAL -->
  <div id="orderModal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3>ОФОРМИТЬ ЗАКАЗ</h3>
      <textarea id="orderComment" placeholder="Комментарий к заказу..."></textarea>
      <div class="modal-actions">
        <button class="btn-send" onclick="submitOrder()">ОТПРАВИТЬ</button>
        <button class="btn-cancel" onclick="closeModal()">ОТМЕНА</button>
      </div>
    </div>

  <script>
    (function() {
      'use strict';

      // ---------- API CONFIG ----------
      const API_BASE = 'https://cricket-palpable-chatter.ngrok-free.dev';
      const API_PRODUCTS = API_BASE + '/api/products';
      // headers required to bypass ngrok browser warning page
      const API_HEADERS = {
        'Content-Type': 'application/json',
        'ngrok-skip-browser-warning': 'true'
      };

      // ---------- TELEGRAM WEBAPP ----------
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      // ---------- ADMIN IDs ----------
      const ADMIN_IDS = [1086313853, 966054850];
      const userId = tg?.initDataUnsafe?.user?.id;
      const adminBtn = document.getElementById('adminBtn');
      if (userId && ADMIN_IDS.includes(userId)) {
        adminBtn.classList.remove('hidden');
      }

      // ---------- GLOBAL STATE ----------
      let products = [];
      let nextProductId = 1;

      // sorted: available first, sold out at end
      function getSortedProducts(list) {
        return [...list].sort((a, b) => (a.soldOut === b.soldOut ? 0 : a.soldOut ? 1 : -1));
      }

      // ---------- API HELPERS ----------
      async function apiGetProducts() {
        const res = await fetch(API_PRODUCTS, {
          method: 'GET',
          headers: API_HEADERS
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      }

      async function apiCreateProduct(data) {
        const res = await fetch(API_PRODUCTS, {
          method: 'POST',
          headers: API_HEADERS,
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      }

      async function apiDeleteProduct(id) {
        const res = await fetch(API_PRODUCTS + '/' + id, {
          method: 'DELETE',
          headers: API_HEADERS
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return true;
      }

      // Normalize product from server: guarantee id, archived, soldOut fields
      function normalizeProduct(p, idx) {
        return {
          id: p.id ?? p._id ?? idx + 1,
          name: p.name || p.title || 'UNNAMED',
          price: p.price || '',
          image: p.image || p.photo || 'https://picsum.photos/id/100/600/600',
          description: p.description || p.desc || '',
          soldOut: !!p.soldOut,
          archived: !!p.archived
        };
      }

      // Recompute nextProductId based on max id
      function updateNextId() {
        let maxId = 0;
        for (const p of products) {
          const n = Number(p.id);
          if (!isNaN(n) && n > maxId) maxId = n;
        }
        nextProductId = maxId + 1;
      }

      // ---------- LOAD FROM SERVER ----------
      async function loadProductsFromServer() {
        try {
          const data = await apiGetProducts();
          // Expect an array; if server wraps in object, try common keys
          let arr = Array.isArray(data) ? data
                    : Array.isArray(data.products) ? data.products
                    : Array.isArray(data.data) ? data.data
                    : [];
          products = arr.map(normalizeProduct);
          updateNextId();
        } catch (err) {
          console.error('loadProducts error:', err);
          alert('Сервер временно недоступен');
          products = [];
        }
        renderAll();
      }

      // ---------- RENDER CATALOG (excludes archived) ----------
      const catalogGrid = document.getElementById('catalogGrid');
      function renderCatalog() {
        const visible = products.filter(p => !p.archived);
        const sorted = getSortedProducts(visible);
        if (sorted.length === 0) {
          catalogGrid.innerHTML = '<div style="grid-column:1/-1; font-family:\'Courier New\',monospace; padding:20px 0;">NO ITEMS IN CATALOG.</div>';
          return;
        }
        catalogGrid.innerHTML = sorted.map(p => `
          <div class="product-card" onclick="openProductDetail(${p.id})">
            <div class="product-image-wrapper">
              <img src="${p.image}" alt="${p.name}" class="${p.soldOut ? 'sold-out-img' : ''}">
              ${p.soldOut ? '<div class="sold-out-badge">SOLD OUT</div>' : ''}
            </div>
            <div class="product-info">
              <div class="product-name">${p.name}</div>
              <div class="product-price">${p.price}</div>
            </div>
          </div>
        `).join('');
      }

      // ---------- RENDER SEARCH (excludes archived) ----------
      const searchInput = document.getElementById('searchInput');
      const searchGrid = document.getElementById('searchGrid');
      function renderSearch(query) {
        const q = query.trim().toLowerCase();
        let filtered = products.filter(p => !p.archived);
        if (q) {
          filtered = filtered.filter(p => p.name.toLowerCase().includes(q));
        }
        const sorted = getSortedProducts(filtered);
        if (sorted.length === 0) {
          searchGrid.innerHTML = '<div style="grid-column:1/-1; font-family:\'Courier New\',monospace; padding:20px 0;">NOTHING FOUND.</div>';
          return;
        }
        searchGrid.innerHTML = sorted.map(p => `
          <div class="product-card" onclick="openProductDetail(${p.id})">
            <div class="product-image-wrapper">
              <img src="${p.image}" alt="${p.name}" class="${p.soldOut ? 'sold-out-img' : ''}">
              ${p.soldOut ? '<div class="sold-out-badge">SOLD OUT</div>' : ''}
            </div>
            <div class="product-info">
              <div class="product-name">${p.name}</div>
              <div class="product-price">${p.price}</div>
            </div>
          </div>
        `).join('');
      }

      searchInput.addEventListener('input', (e) => {
        renderSearch(e.target.value);
      });

      // ---------- ARCHIVE GRID ----------
      const archiveGrid = document.getElementById('archiveGrid');
      function renderArchive() {
        const archived = products.filter(p => p.archived);
        if (archived.length === 0) {
          archiveGrid.innerHTML = '<div style="grid-column:1/-1; font-family:\'Courier New\',monospace; padding:20px 0;">ARCHIVE IS EMPTY.</div>';
          return;
        }
        archiveGrid.innerHTML = archived.map(p => `
          <div class="archive-item" onclick="openFullscreen('${p.image}')">
            <img src="${p.image}" alt="${p.name}">
          </div>
        `).join('');
      }

      // fullscreen overlay
      const fullscreenOverlay = document.getElementById('fullscreenOverlay');
      const fullscreenImage = document.getElementById('fullscreenImage');

      window.openFullscreen = function(src) {
        fullscreenImage.src = src;
        fullscreenOverlay.classList.remove('hidden');
      };

      window.closeFullscreen = function() {
        fullscreenOverlay.classList.add('hidden');
        fullscreenImage.src = '';
      };

      fullscreenOverlay.addEventListener('click', (e) => {
        if (e.target === fullscreenOverlay) closeFullscreen();
      });

      // ---------- PRODUCT DETAIL (screen 3) ----------
      const detailScreen = document.getElementById('screen-detail');
      let currentProductId = null;

      window.openProductDetail = function(id) {
        const product = products.find(p => Number(p.id) === Number(id));
        if (!product) return;
        currentProductId = product.id;

        let actionButtonHTML;
        if (product.soldOut) {
          actionButtonHTML = `
            <button class="order-btn" disabled 
              style="background:#888 !important; border-color:#888 !important; color:#fff !important; cursor:not-allowed !important;">
              SOLD OUT
            </button>
          `;
        } else {
          actionButtonHTML = `
            <button class="order-btn" onclick="openOrderModal()">ОФОРМИТЬ ЗАКАЗ</button>
          `;
        }

        const soldOutBlock = product.soldOut
          ? `<div style="margin-top:12px; display:inline-block; background:#000; color:#fff; font-family:'Anton',sans-serif; padding:6px 18px; letter-spacing:2px;">SOLD OUT</div>`
          : '';

        detailScreen.innerHTML = `
          <h1 class="screen-header" style="font-size:32px; margin-top:12px;">${product.name}</h1>
          <img class="detail-image" src="${product.image}" alt="${product.name}">
          <div class="detail-price">${product.price}</div>
          ${soldOutBlock}
          <div class="detail-description">${product.description}</div>
          ${actionButtonHTML}
        `;

        showScreen('detail');
      };

      // ---------- ORDER MODAL ----------
      const orderModal = document.getElementById('orderModal');
      const orderComment = document.getElementById('orderComment');

      window.openOrderModal = function() {
        orderModal.classList.remove('hidden');
        orderComment.value = '';
      };

      window.closeModal = function() {
        orderModal.classList.add('hidden');
      };

      window.submitOrder = function() {
        const comment = orderComment.value.trim();
        const payload = {
          productId: currentProductId,
          comment: comment || '(no comment)'
        };

        if (tg && tg.sendData) {
          try {
            tg.sendData(JSON.stringify(payload));
            tg.close();
          } catch (e) {
            alert('Ошибка отправки: ' + e.message);
          }
        } else {
          alert('Telegram WebApp не доступен. Данные: ' + JSON.stringify(payload));
        }
        closeModal();
      };

      orderModal.addEventListener('click', (e) => {
        if (e.target === orderModal) closeModal();
      });

      // ---------- ADMIN: LIST & FORM ----------
      const adminList = document.getElementById('adminList');
      const adminFormContainer = document.getElementById('adminFormContainer');
      const adminFormTitle = document.getElementById('adminFormTitle');
      const adminName = document.getElementById('adminName');
      const adminPrice = document.getElementById('adminPrice');
      const adminDesc = document.getElementById('adminDesc');
      const adminImage = document.getElementById('adminImage');
      const adminSoldOut = document.getElementById('adminSoldOut');

      let editingProductId = null;

      window.renderAdminList = function() {
        if (products.length === 0) {
          adminList.innerHTML = '<div style="padding:20px 0; font-family:\'Courier New\',monospace;">NO PRODUCTS YET.</div>';
          return;
        }
        adminList.innerHTML = products.map(p => {
          const status = p.archived ? 'ARCHIVED' : (p.soldOut ? 'SOLD OUT' : 'ACTIVE');
          return `
            <div class="admin-product-row">
              <div class="admin-product-info">
                <div class="admin-product-name">${p.name}</div>
                <div class="admin-product-price">${p.price}</div>
                <div class="admin-product-status">${status}</div>
              </div>
              <div class="admin-actions">
                <button onclick="editProduct(${p.id})">EDIT</button>
                ${p.archived
                  ? `<button onclick="restoreProduct(${p.id})">RESTORE</button>`
                  : `<button onclick="archiveProduct(${p.id})">ARCHIVE</button>`}
                <button class="danger" onclick="deleteProduct(${p.id})">DELETE</button>
                ${!p.archived && !p.soldOut
                  ? `<button class="danger" onclick="markSoldOut(${p.id})">SOLD OUT</button>`
                  : ''}
              </div>
            </div>
          `;
        }).join('');
      };

      window.showAdminForm = function(mode, productId) {
        editingProductId = null;
        adminFormContainer.classList.remove('hidden');
        adminList.classList.add('hidden');
        document.querySelector('.admin-add-btn').classList.add('hidden');

        if (mode === 'create') {
          adminFormTitle.textContent = 'НОВЫЙ ТОВАР';
          adminName.value = '';
          adminPrice.value = '';
          adminDesc.value = '';
          adminImage.value = 'https://picsum.photos/id/100/600/600';
          adminSoldOut.checked = false;
        } else if (mode === 'edit' && productId) {
          const p = products.find(x => Number(x.id) === Number(productId));
          if (!p) return;
          editingProductId = productId;
          adminFormTitle.textContent = 'РЕДАКТИРОВАТЬ: ' + p.name;
          adminName.value = p.name;
          adminPrice.value = p.price;
          adminDesc.value = p.description;
          adminImage.value = p.image;
          adminSoldOut.checked = p.soldOut;
        }
      };

      window.hideAdminForm = function() {
        adminFormContainer.classList.add('hidden');
        adminList.classList.remove('hidden');
        document.querySelector('.admin-add-btn').classList.remove('hidden');
        editingProductId = null;
      };

      // Save: CREATE sends POST to server; EDIT updates local only (no PATCH endpoint specified)
      window.saveAdminForm = async function() {
        const name = adminName.value.trim();
        const price = adminPrice.value.trim();
        const desc = adminDesc.value.trim();
        const image = adminImage.value.trim() || 'https://picsum.photos/id/100/600/600';
        const soldOut = adminSoldOut.checked;

        if (!name || !price) {
          alert('Заполните название и цену.');
          return;
        }

        if (editingProductId !== null) {
          // Local edit (no PATCH endpoint provided). Update local array.
          const p = products.find(x => Number(x.id) === Number(editingProductId));
          if (p) {
            p.name = name;
            p.price = price;
            p.description = desc;
            p.image = image;
            p.soldOut = soldOut;
          }
          hideAdminForm();
          renderAll();
          return;
        }

        // CREATE — send POST to server
        const newProduct = {
          name: name,
          price: price,
          description: desc,
          image: image,
          soldOut: soldOut,
          archived: false
        };

        try {
          await apiCreateProduct(newProduct);
          // Reload from server to get authoritative state
          await loadProductsFromServer();
          hideAdminForm();
          showScreen('admin');
        } catch (err) {
          console.error('create error:', err);
          alert('Сервер временно недоступен');
        }
      };

      window.editProduct = function(id) {
        showAdminForm('edit', id);
      };

      // ARCHIVE / RESTORE / SOLD OUT are local-only operations
      window.archiveProduct = function(id) {
        const p = products.find(x => Number(x.id) === Number(id));
        if (p) {
          p.archived = true;
          renderAll();
        }
      };

      window.restoreProduct = function(id) {
        const p = products.find(x => Number(x.id) === Number(id));
        if (p) {
          p.archived = false;
          renderAll();
        }
      };

      window.markSoldOut = function(id) {
        const p = products.find(x => Number(x.id) === Number(id));
        if (p) {
          p.soldOut = true;
          renderAll();
        }
      };

      // DELETE — send DELETE to server, remove from UI on success
      window.deleteProduct = async function(id) {
        const p = products.find(x => Number(x.id) === Number(id));
        if (!p) return;
        if (!confirm('Удалить товар "' + p.name + '"?')) return;

        try {
          await apiDeleteProduct(p.id);
          // Remove from local array and re-render
          products = products.filter(x => Number(x.id) !== Number(p.id));
          renderAll();
        } catch (err) {
          console.error('delete error:', err);
          alert('Сервер временно недоступен');
        }
      };

      // ---------- RENDER ALL ----------
      function renderAll() {
        renderCatalog();
        renderSearch(searchInput.value);
        renderArchive();
        renderAdminList();
      }

      // ---------- SCREEN SWITCHING (SPA) WITH FADE-IN ----------
      const screens = {
        catalog: document.getElementById('screen-catalog'),
        archive: document.getElementById('screen-archive'),
        detail: document.getElementById('screen-detail'),
        search: document.getElementById('screen-search'),
        help: document.getElementById('screen-help'),
        admin: document.getElementById('screen-admin')
      };

      const navButtons = {
        catalog: document.getElementById('navCatalog'),
        archive: document.getElementById('navArchive'),
        search: document.getElementById('navSearch'),
        help: document.getElementById('navHelp')
      };

      let currentScreenName = 'catalog';

      window.showScreen = function(name) {
        const isSameScreen = (currentScreenName === name);

        Object.values(screens).forEach(s => {
          s.classList.add('hidden');
          s.classList.remove('fade-in');
        });

        const target = screens[name];
        if (target) {
          target.classList.remove('hidden');
          if (!isSameScreen) {
            target.classList.add('fade-in');
            setTimeout(() => {
              target.classList.remove('fade-in');
            }, 220);
          }
        }

        Object.entries(navButtons).forEach(([key, btn]) => {
          if (btn) btn.classList.toggle('active', key === name);
        });

        if (name === 'search') {
          renderSearch(searchInput.value);
        }
        if (name === 'catalog') {
          renderCatalog();
        }
        if (name === 'archive') {
          renderArchive();
        }
        if (name === 'admin') {
          hideAdminForm();
          renderAdminList();
        }

        currentScreenName = name;
      };

      // ---------- INITIAL LOAD ----------
      // Start with catalog rendering empty, then fetch from server
      renderAll();
      showScreen('catalog');
      loadProductsFromServer();

      // ---------- ADDITIONAL: close fullscreen on ESC ----------
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeFullscreen();
          closeModal();
        }
      });

      // expose for debugging
      window.renderCatalog = renderCatalog;
      window.renderSearch = renderSearch;
      window.renderArchive = renderArchive;
      window.loadProductsFromServer = loadProductsFromServer;
    })();
  </script>
</body>
</html>
