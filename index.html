    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border-radius: 0 !important; /* brutalist no radius */
    }

    html, body {
      height: 100%;

      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    /* ----- LAYOUT & UTILS ----- */
    .container {
      flex: 1;
      padding: 16px 12px 24px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;

    .hidden {
      display: none !important;
    }

    /* ----- FADE-IN ANIMATION ----- */

      from { opacity: 0; }
      to   { opacity: 1; }

      animation: fadeIn 0.2s ease-in-out;

    /* ----- ADMIN BUTTON (top-right, no overlap) ----- */

    }

    /* ----- PRODUCT GRID (2 columns) ----- */

      gap: 16px 12px;
    }

    .product-card {
      display: flex;

    }

      background: #eee;

      border-bottom: 2px solid #000;
    }

    .product-image-wrapper img {
      width: 100%;

      transition: none;

<body>

  <!-- ADMIN BUTTON (shown conditionally) -->
  <button id="adminBtn" class="hidden" onclick="showScreen('admin')">[ ADMIN ]</button>

  <!-- MAIN CONTAINER (screens) -->
  <div class="container">

  <!-- ORDER MODAL -->

  <script>
    (function() {
      'use strict';

      // ---------- API CONFIG ----------
      const API_BASE = 'https://cricket-palpable-chatter.ngrok-free.dev';
      const API_PRODUCTS = API_BASE + '/api/products';
      const API_ORDERS = API_BASE + '/api/orders'; // Маршрут для заказов
      const API_HEADERS = {
        'Content-Type': 'application/json',
        'ngrok-skip-browser-warning': 'true'
      };

      // ---------- TELEGRAM WEBAPP ----------
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      // ---------- ADMIN IDs ----------
      const ADMIN_IDS = [1086313853, 966054850];
      const userId = tg?.initDataUnsafe?.user?.id;
      const adminBtn = document.getElementById('adminBtn');
      if (userId && ADMIN_IDS.includes(userId)) {
        adminBtn.classList.remove('hidden');
      }

      // ---------- GLOBAL STATE ----------
      let products = [];
      let nextProductId = 1;

      // sorted: available first, sold out at end
      function getSortedProducts(list) {
        return [...list].sort((a, b) => (a.soldOut === b.soldOut ? 0 : a.soldOut ? 1 : -1));
      }

      // ---------- API HELPERS ----------
      async function apiGetProducts() {
        const res = await fetch(API_PRODUCTS, {
          method: 'GET',
          headers: API_HEADERS
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      }

      async function apiCreateProduct(data) {
        const res = await fetch(API_PRODUCTS, {
          method: 'POST',
          headers: API_HEADERS,
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      }

      // Обновление товара (архив, soldout, редактирование)
      async function apiUpdateProduct(id, data) {
        const res = await fetch(API_PRODUCTS + '/' + id, {
          method: 'PATCH', 
          headers: API_HEADERS,
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      }

      async function apiDeleteProduct(id) {
        const res = await fetch(API_PRODUCTS + '/' + id, {
          method: 'DELETE',
          headers: API_HEADERS
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return true;
      }

      // Parse image textarea into array of URLs (split by comma or newline)
      function parseImagesInput(raw) {
        if (!raw) return [];
        return raw
          .split(/[\n,]+/)
          .map(s => s.trim())
          .filter(Boolean);
      }

      // Normalize product from server
      function normalizeProduct(p, idx) {
        let imgs = [];
        if (Array.isArray(p.images) && p.images.length > 0) {
          imgs = p.images.filter(Boolean);
        } else if (typeof p.images === 'string' && p.images.trim()) {
          imgs = parseImagesInput(p.images);
        } else if (typeof p.image === 'string' && p.image.trim()) {
          imgs = [p.image.trim()];
        } else if (Array.isArray(p.image)) {
          imgs = p.image.filter(Boolean);
        }
        if (imgs.length === 0) {
          imgs = ['https://picsum.photos/id/100/600/600'];
        }

        // Безопасное приведение к boolean (на случай если сервер вернет 1, "true", "1" и т.д.)
        const isArchived = !!(p.archived === true || p.archived === 1 || p.archived === 'true' || p.archived === '1');
        const isSoldOut = !!(p.soldOut === true || p.soldOut === 1 || p.soldOut === 'true' || p.soldOut === '1');

        return {
          id: p.id ?? p._id ?? idx + 1,
          name: p.name || p.title || 'UNNAMED',
          price: p.price || '',
          images: imgs,
          description: p.description || p.desc || '',
          soldOut: isSoldOut,
          archived: isArchived
        };
      }

      function updateNextId() {
        let maxId = 0;
        for (const p of products) {
          const n = Number(p.id);
          if (!isNaN(n) && n > maxId) maxId = n;
        }
        nextProductId = maxId + 1;
      }

      async function loadProductsFromServer() {
        try {
          const data = await apiGetProducts();
          let arr = Array.isArray(data) ? data
                    : Array.isArray(data.products) ? data.products
                    : Array.isArray(data.data) ? data.data
                    : [];
          products = arr.map(normalizeProduct);
          updateNextId();
        } catch (err) {
          console.error('loadProducts error:', err);
          alert('Сервер временно недоступен');
          products = [];
        }
        renderAll();
      }

      // ---------- RENDER CATALOG ----------
      const catalogGrid = document.getElementById('catalogGrid');
      function renderCatalog() {
        const visible = products.filter(p => !p.archived);
        const sorted = getSortedProducts(visible);
        if (sorted.length === 0) {
          catalogGrid.innerHTML = '<div style="grid-column:1/-1; font-family:\'Courier New\',monospace; padding:20px 0;">NO ITEMS IN CATALOG.</div>';
          return;
        }
        catalogGrid.innerHTML = sorted.map(p => `
          <div class="product-card" onclick="openProductDetail(${p.id})">
            <div class="product-image-wrapper">
              <img src="${p.images[0]}" alt="${p.name}" class="${p.soldOut ? 'sold-out-img' : ''}">
              ${p.soldOut ? '<div class="sold-out-badge">SOLD OUT</div>' : ''}
            </div>
            <div class="product-info">
              <div class="product-name">${p.name}</div>
              <div class="product-price">${p.price}</div>
            </div>
          </div>
        `).join('');
      }

      // ---------- RENDER SEARCH ----------
      const searchInput = document.getElementById('searchInput');
      const searchGrid = document.getElementById('searchGrid');
      function renderSearch(query) {
        const q = query.trim().toLowerCase();
        let filtered = products.filter(p => !p.archived);
        if (q) {
          filtered = filtered.filter(p => p.name.toLowerCase().includes(q));
        }
        const sorted = getSortedProducts(filtered);
        if (sorted.length === 0) {
          searchGrid.innerHTML = '<div style="grid-column:1/-1; font-family:\'Courier New\',monospace; padding:20px 0;">NOTHING FOUND.</div>';
          return;
        }
        searchGrid.innerHTML = sorted.map(p => `
          <div class="product-card" onclick="openProductDetail(${p.id})">
            <div class="product-image-wrapper">
              <img src="${p.images[0]}" alt="${p.name}" class="${p.soldOut ? 'sold-out-img' : ''}">
              ${p.soldOut ? '<div class="sold-out-badge">SOLD OUT</div>' : ''}
            </div>
            <div class="product-info">
              <div class="product-name">${p.name}</div>
              <div class="product-price">${p.price}</div>
            </div>
          </div>
        `).join('');
      }

      searchInput.addEventListener('input', (e) => {
        renderSearch(e.target.value);
      });

      // ---------- ARCHIVE GRID ----------
      const archiveGrid = document.getElementById('archiveGrid');
      function renderArchive() {
        const archived = products.filter(p => p.archived);
        if (archived.length === 0) {
          archiveGrid.innerHTML = '<div style="grid-column:1/-1; font-family:\'Courier New\',monospace; padding:20px 0;">ARCHIVE IS EMPTY.</div>';
          return;
        }
        archiveGrid.innerHTML = archived.map(p => `
          <div class="archive-item" onclick="openFullscreen('${p.images[0]}')">
            <img src="${p.images[0]}" alt="${p.name}">
          </div>
        `).join('');
      }

      const fullscreenOverlay = document.getElementById('fullscreenOverlay');
      const fullscreenImage = document.getElementById('fullscreenImage');

      window.openFullscreen = function(src) {
        fullscreenImage.src = src;
        fullscreenOverlay.classList.remove('hidden');
      };

      window.closeFullscreen = function() {
        fullscreenOverlay.classList.add('hidden');
        fullscreenImage.src = '';
      };

      fullscreenOverlay.addEventListener('click', (e) => {
        if (e.target === fullscreenOverlay) closeFullscreen();
      });

      // ---------- PRODUCT DETAIL WITH CAROUSEL ----------
      const detailScreen = document.getElementById('screen-detail');
      let currentProductId = null;

      window.openProductDetail = function(id) {
        const product = products.find(p => Number(p.id) === Number(id));
        if (!product) return;
        currentProductId = product.id;

        const imgs = product.images && product.images.length > 0
          ? product.images
          : ['https://picsum.photos/id/100/600/600'];

        const slides = imgs.map(src => `
          <div class="detail-carousel-slide">
            <img src="${src}" alt="${product.name}">
          </div>
        `).join('');

        let arrowsHTML = '';
        let dotsHTML = '';
        
        if (imgs.length > 1) {
          arrowsHTML = `
            <div class="carousel-arrow left" onclick="scrollCarousel(-1)">‹</div>
            <div class="carousel-arrow right" onclick="scrollCarousel(1)">›</div>
          `;
          dotsHTML = '<div class="carousel-dots" id="carouselDots">' +
            imgs.map((_, i) => `<div class="carousel-dot${i === 0 ? ' active' : ''}" data-index="${i}" onclick="scrollToSlide(${i})"></div>`).join('') +
            '</div>';
        }

        let actionButtonHTML;
        if (product.soldOut) {
          actionButtonHTML = `
            <button class="order-btn" disabled 
              style="background:#888 !important; border-color:#888 !important; color:#fff !important; cursor:not-allowed !important;">
              SOLD OUT
            </button>
          `;
        } else {
          actionButtonHTML = `
            <button class="order-btn" onclick="openOrderModal()">ОФОРМИТЬ ЗАКАЗ</button>
          `;
        }

        const soldOutBlock = product.soldOut
          ? `<div style="margin-top:12px; display:inline-block; background:#000; color:#fff; font-family:'Anton',sans-serif; padding:6px 18px; letter-spacing:2px;">SOLD OUT</div>`
          : '';

        detailScreen.innerHTML = `
          <h1 class="screen-header" style="font-size:32px; margin-top:12px;">${product.name}</h1>
          
          <div class="detail-carousel-wrapper">
            <div class="detail-carousel" id="detailCarousel">${slides}</div>
            ${arrowsHTML}
          </div>
          ${dotsHTML}
          
          <div class="detail-price">${product.price}</div>
          ${soldOutBlock}
          <div class="detail-description">${product.description}</div>
          ${actionButtonHTML}
        `;

        const carousel = document.getElementById('detailCarousel');
        if (carousel && imgs.length > 1) {
          if (carousel._prevHandler) {
            carousel.removeEventListener('scroll', carousel._prevHandler);
          }
          const handler = () => {
            const idx = Math.round(carousel.scrollLeft / carousel.clientWidth);
            const dots = document.querySelectorAll('.carousel-dot');
            dots.forEach((d, i) => d.classList.toggle('active', i === idx));
          };
          carousel._prevHandler = handler;
          carousel.addEventListener('scroll', handler, { passive: true });
        }

        showScreen('detail');
      };

      window.scrollCarousel = function(direction) {
        const carousel = document.getElementById('detailCarousel');
        if (!carousel) return;
        const slideWidth = carousel.clientWidth;
        carousel.scrollBy({ left: slideWidth * direction, behavior: 'smooth' });
      };

      window.scrollToSlide = function(index) {
        const carousel = document.getElementById('detailCarousel');
        if (!carousel) return;
        const slideWidth = carousel.clientWidth;
        carousel.scrollTo({ left: slideWidth * index, behavior: 'smooth' });
      };

      // ---------- ORDER MODAL ----------
      const orderModal = document.getElementById('orderModal');
      const orderComment = document.getElementById('orderComment');

      window.openOrderModal = function() {
        orderModal.classList.remove('hidden');
        orderComment.value = '';
      };

      window.closeModal = function() {
        orderModal.classList.add('hidden');
      };

      // ---------- ОБНОВЛЕННАЯ ФУНКЦИЯ ОТПРАВКИ ЗАКАЗА ----------
      window.submitOrder = async function() {
        const comment = orderComment.value.trim();
        
        if (!currentProductId) { alert('Ошибка: товар не выбран!'); return; }

        const payload = {
          productId: currentProductId,
          comment: comment || '(без комментария)',
          // Автоматически берем данные из Telegram
          userId: tg?.initDataUnsafe?.user?.id || null,
          username: tg?.initDataUnsafe?.user?.username || null,
          fullName: tg?.initDataUnsafe?.user ? `${tg.initDataUnsafe.user.first_name || ''} ${tg.initDataUnsafe.user.last_name || ''}`.trim() : null
        };

        try {
            // Отправляем POST-запрос на наш API
            const res = await fetch(API_ORDERS, {
                method: 'POST',
                headers: API_HEADERS,
                body: JSON.stringify(payload)
            });
            
            if (!res.ok) throw new Error('Ошибка сервера');
            
            closeModal();
            alert('✅ Заказ успешно отправлен! Ожидайте сообщения.');
            if (tg) tg.close(); // Закрываем Mini App
            
        } catch (e) {
            console.error('Ошибка отправки заказа:', e);
            alert('❌ Сервер временно недоступен. Попробуйте позже.');
        }
      };

      orderModal.addEventListener('click', (e) => {
        if (e.target === orderModal) closeModal();
      });

      // ---------- ADMIN ----------
      const adminList = document.getElementById('adminList');
      const adminFormContainer = document.getElementById('adminFormContainer');
      const adminFormTitle = document.getElementById('adminFormTitle');
      const adminName = document.getElementById('adminName');
      const adminPrice = document.getElementById('adminPrice');
      const adminDesc = document.getElementById('adminDesc');
      const adminImages = document.getElementById('adminImages');
      const adminSoldOut = document.getElementById('adminSoldOut');

      let editingProductId = null;

      window.renderAdminList = function() {
        if (products.length === 0) {
          adminList.innerHTML = '<div style="padding:20px 0; font-family:\'Courier New\',monospace;">NO PRODUCTS YET.</div>';
          return;
        }
        adminList.innerHTML = products.map(p => {
          const status = p.archived ? 'ARCHIVED' : (p.soldOut ? 'SOLD OUT' : 'ACTIVE');
          return `
            <div class="admin-product-row">
              <div class="admin-product-info">
                <div class="admin-product-name">${p.name}</div>
                <div class="admin-product-price">${p.price}</div>
                <div class="admin-product-status">${status} · ${p.images.length} img</div>
              </div>
              <div class="admin-actions">
                <button onclick="editProduct(${p.id})">EDIT</button>
                ${p.archived
                  ? `<button onclick="restoreProduct(${p.id})">RESTORE</button>`
                  : `<button onclick="archiveProduct(${p.id})">ARCHIVE</button>`}
                <button class="danger" onclick="deleteProduct(${p.id})">DELETE</button>
                ${!p.archived && !p.soldOut
                  ? `<button class="danger" onclick="markSoldOut(${p.id})">SOLD OUT</button>`
                  : ''}
              </div>
            </div>
          `;
        }).join('');
      };

      window.showAdminForm = function(mode, productId) {
        editingProductId = null;
        adminFormContainer.classList.remove('hidden');
        adminList.classList.add('hidden');
        document.querySelector('.admin-add-btn').classList.add('hidden');

        if (mode === 'create') {
          adminFormTitle.textContent = 'НОВЫЙ ТОВАР';
          adminName.value = '';
          adminPrice.value = '';
          adminDesc.value = '';
          adminImages.value = 'https://picsum.photos/id/100/600/600';
          adminSoldOut.checked = false;
        } else if (mode === 'edit' && productId) {
          const p = products.find(x => Number(x.id) === Number(productId));
          if (!p) return;
          editingProductId = productId;
          adminFormTitle.textContent = 'РЕДАКТИРОВАТЬ: ' + p.name;
          adminName.value = p.name;
          adminPrice.value = p.price;
          adminDesc.value = p.description;
          adminImages.value = (p.images || []).join('\n');
          adminSoldOut.checked = p.soldOut;
        }
      };

      window.hideAdminForm = function() {
        adminFormContainer.classList.add('hidden');
        adminList.classList.remove('hidden');
        document.querySelector('.admin-add-btn').classList.remove('hidden');
        editingProductId = null;
      };

      window.saveAdminForm = async function() {
        const name = adminName.value.trim();
        const price = adminPrice.value.trim();
        const desc = adminDesc.value.trim();
        let images = parseImagesInput(adminImages.value);
        if (images.length === 0) {
          images = ['https://picsum.photos/id/100/600/600'];
        }
        const soldOut = adminSoldOut.checked;

        if (!name || !price) {
          alert('Заполните название и цену.');
          return;
        }

        if (editingProductId !== null) {
          const p = products.find(x => Number(x.id) === Number(editingProductId));
          const updateData = {
            name: name,
            price: price,
            description: desc,
            images: images,
            soldOut: soldOut,
            archived: p ? p.archived : false
          };
          try {
            await apiUpdateProduct(editingProductId, updateData);
            await loadProductsFromServer();
            hideAdminForm();
          } catch (err) {
            console.error('edit error:', err);
            alert('Сервер временно недоступен');
          }
          return;
        }

        const newProduct = {
          name: name,
          price: price,
          description: desc,
          images: images,
          soldOut: soldOut,
          archived: false
        };

        try {
          await apiCreateProduct(newProduct);
          await loadProductsFromServer();
          hideAdminForm();
          showScreen('admin');
        } catch (err) {
          console.error('create error:', err);
          alert('Сервер временно недоступен');
        }
      };

      window.editProduct = function(id) {
        showAdminForm('edit', id);
      };

      window.archiveProduct = async function(id) {
        const p = products.find(x => Number(x.id) === Number(id));
        if (!p) return;
        
        try {
          await apiUpdateProduct(p.id, { archived: true });
          await loadProductsFromServer();
          showScreen('archive');
        } catch (err) {
          console.error('archive error:', err);
          alert('Сервер временно недоступен');
        }
      };

      window.restoreProduct = async function(id) {
        const p = products.find(x => Number(x.id) === Number(id));
        if (!p) return;

        try {
          await apiUpdateProduct(p.id, { archived: false });
          await loadProductsFromServer();
        } catch (err) {
          console.error('restore error:', err);
          alert('Сервер временно недоступен');
        }
      };

      window.markSoldOut = async function(id) {
        const p = products.find(x => Number(x.id) === Number(id));
        if (!p) return;

        try {
          await apiUpdateProduct(p.id, { soldOut: true });
          await loadProductsFromServer();
        } catch (err) {
          console.error('soldOut error:', err);
          alert('Сервер временно недоступен');
        }
      };

      window.deleteProduct = async function(id) {
        const p = products.find(x => Number(x.id) === Number(id));
        if (!p) return;
        if (!confirm('Удалить товар "' + p.name + '"?')) return;

        try {
          await apiDeleteProduct(p.id);
          products = products.filter(x => Number(x.id) !== Number(p.id));
          renderAll();
        } catch (err) {
          console.error('delete error:', err);
          alert('Сервер временно недоступен');
        }
      };

      function renderAll() {
        renderCatalog();
        renderSearch(searchInput.value);
        renderArchive();
        renderAdminList();
      }

      // ---------- SPA NAVIGATION ----------
      const screens = {
        catalog: document.getElementById('screen-catalog'),
        archive: document.getElementById('screen-archive'),
        detail: document.getElementById('screen-detail'),
        search: document.getElementById('screen-search'),
        help: document.getElementById('screen-help'),
        admin: document.getElementById('screen-admin')
      };

      const navButtons = {
        catalog: document.getElementById('navCatalog'),
        archive: document.getElementById('navArchive'),
        search: document.getElementById('navSearch'),
        help: document.getElementById('navHelp')
      };

      let currentScreenName = 'catalog';

      window.showScreen = function(name) {
        const isSameScreen = (currentScreenName === name);

        Object.values(screens).forEach(s => {
          s.classList.add('hidden');
          s.classList.remove('fade-in');
        });

        const target = screens[name];
        if (target) {
          target.classList.remove('hidden');
          if (!isSameScreen) {
            target.classList.add('fade-in');
            setTimeout(() => {
              target.classList.remove('fade-in');
            }, 220);
          }
        }

        Object.entries(navButtons).forEach(([key, btn]) => {
          if (btn) btn.classList.toggle('active', key === name);
        });

        if (name === 'search') renderSearch(searchInput.value);
        if (name === 'catalog') renderCatalog();
        if (name === 'archive') renderArchive();
        if (name === 'admin') {
          hideAdminForm();
          renderAdminList();
        }

        currentScreenName = name;
      };

      // ---------- INITIAL LOAD ----------
      renderAll();
      showScreen('catalog');
      loadProductsFromServer();

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeFullscreen();
          closeModal();
        }
      });
    })();
  </script>
</body>
</html>
